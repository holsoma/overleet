services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: overleet
      POSTGRES_DB: overleet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U overleet -d overleet"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres_data:
