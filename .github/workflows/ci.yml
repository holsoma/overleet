name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: overleet
          POSTGRES_DB: overleet_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U overleet -d overleet_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://overleet@127.0.0.1:5432/overleet_test
      TEST_DATABASE_URL: postgresql://overleet@127.0.0.1:5432/overleet_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run db:generate
      - run: npm run check:files
      - run: node scripts/scan-secrets.mjs
      - run: npm run validate:questions
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm test
      - name: Restore reviewed question content after disposable tests
        run: |
          node --import tsx scripts/reset-test-database.ts
          npm run db:sync
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
